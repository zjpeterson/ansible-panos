---
- name: Pick up security rules
  hosts: apd-panos-fw
  connection: local
  gather_facts: false

  tasks:
    - name: Interface query
      paloaltonetworks.panos.panos_interface:
        provider: "{{ panos_provider }}"
        state: gathered
        gathered_filter: "*"
      register: _interfaces

    - name: Zone query
      paloaltonetworks.panos.panos_zone:
        provider: "{{ panos_provider }}"
        state: gathered
        gathered_filter: "*"
      register: _zones

    - name: Rule query
      paloaltonetworks.panos.panos_security_rule:
        provider: "{{ panos_provider }}"
        state: gathered
        gathered_filter: "*"
      register: _rules

    - name: Set zones and rules
      ansible.builtin.set_stats:
        data:
          source_interfaces: "{{ _interfaces.gathered }}"
          source_zones: "{{ _zones.gathered }}"
          source_rules: "{{ _rules.gathered }}"
